<!DOCTYPE html>
<html>
<head>
    <title>Notification Agent Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #2c3e50; }
        .session-list { margin-top: 20px; }
        .session-item { background: #fff; padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #ddd; }
        .btn { background: #3498db; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Notification Sessions</h1>
        <div class="session-list">
            <!-- Session items will be dynamically loaded here -->
        </div>
    </div>
</body>
</html>
